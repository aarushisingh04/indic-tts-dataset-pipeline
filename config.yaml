audio:
  sample_rate: 24000
  channels: 1
  format: wav

segmentation:
  min_duration: 4     # seconds — drop segments shorter than this
  max_duration: 29      # seconds — hard split at this length
  silence_thresh_db: -40
  min_silence_ms: 800   # ms of silence to treat as a segment boundary

emotion_taxonomy:
  - neutral
  - formal
  - happy
  - sad
  - excited
  - angry
  - calm
  - whisper

